# Akeyless Gateway Helm Values
# Hostname: akeyless.fklab.local
# Namespace: infra-security

globalConfig:
  gatewayAuth:
    # API Key authentication
    gatewayAccessId: "p-50gm9w7qkh26am"
    gatewayAccessType: "access_key"
    # K8s secret containing the API key (key: gateway-access-key)
    gatewayCredentialsExistingSecret: "akeyless-gateway-credentials"

  # Gateway admin access permissions (SAML)
  allowedAccessPermissions:
    - name: "Administrators"
      access_id: "p-4hr352lth7m5sm"
      sub_claims:
        email:
          - "fahmy.k@akeyless.io"
      permissions:
        - "admin"

  # Service account for K8s secrets management
  serviceAccount:
    create: true
    serviceAccountName: akeyless-gateway-sa
    annotations: {}

  # Cluster identification
  clusterName: "titan-gateway"
  initialClusterDisplayName: "Titan K8s Gateway"

  # TLS Configuration (disabled - TLS terminates at nginx)
  TLSConf:
    enabled: false

  # Metrics for Prometheus/OpenObserve
  metrics:
    enabled: true
    metricsExistingSecret: "akeyless-metrics-config"

  # Cache configuration
  clusterCache:
    enabled: true
    enableTls: false
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    persistence:
      enabled: true
      accessMode: "ReadWriteOnce"
      size: 5Gi

# Gateway deployment configuration
gateway:
  deployment:
    replicaCount: 1  # Single replica for home lab
    labels:
      app: akeyless-gateway
      environment: production

    pod:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/metrics"

    livenessProbe:
      initialDelaySeconds: 120
      periodSeconds: 30
      failureThreshold: 10

    readinessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5

  # Service configuration
  service:
    type: ClusterIP  # Using Ingress instead of LoadBalancer
    port: 8000
    targetPort: 18888  # Gateway runs on 18888 when TLS is disabled
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8200"
    labels:
      app: akeyless-gateway

  # Ingress configuration for akeyless.fklab.local
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      cert-manager.io/cluster-issuer: "mkcert-ca-issuer"
    rules:
      - servicePort: gateway
        hostname: "akeyless.fklab.local"
    path: /
    pathType: Prefix
    tls: true
    existingSecret: "akeyless-gateway-tls"
    certManager: true

  # Resource limits for home lab
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Disable HPA for single-node setup
  hpa:
    enabled: false

# Secure Remote Access
sra:
  enabled: true

  # Web bastion (RDP/browser-based remote access)
  webConfig:
    deployment:
      labels:
        app: akeyless-sra-web
    replicaCount: 1
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 10
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    hpa:
      enabled: false

  # SSH bastion (session recording, cert-based access)
  sshConfig:
    deployment:
      labels:
        app: akeyless-sra-ssh
    replicaCount: 1
    # RSA public key from SSH cert issuer: /akeyless-lab/SSH/SSH-ISSUER
    CAPublicKey: |
      ssh-rsa 
    service:
      type: LoadBalancer
      port: 22
      annotations:
        metallb.universe.tf/address-pool: "default-addresspool"
      labels:
        app: akeyless-sra-ssh
    livenessProbe:
      failureThreshold: 5
      periodSeconds: 30
      timeoutSeconds: 5
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    hpa:
      enabled: false
