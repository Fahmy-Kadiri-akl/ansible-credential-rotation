---
# Akeyless Gateway Credentials Secret
# IMPORTANT: Update the gateway-uid-token with your actual Universal Identity token
apiVersion: v1
kind: Secret
metadata:
  name: akeyless-gateway-credentials
  namespace: infra-security
  labels:
    app: akeyless-gateway
type: Opaque
stringData:
  # Universal Identity token - obtain from Akeyless console
  # Run: akeyless uid-generate-token --uid-token-type=dynamic
  gateway-uid-token: "REPLACE_WITH_UID_TOKEN"
