---
# TLS Secret for Akeyless Gateway
# Generated with mkcert for akeyless.fklab.local
# This secret includes all key name formats required by the Helm chart
# Certificate expires: April 22, 2028
apiVersion: v1
kind: Secret
metadata:
  name: akeyless-gateway-tls-fixed
  namespace: infra-security
  labels:
    app: akeyless-gateway
type: Opaque
data:
  # Standard TLS keys (kubernetes.io/tls format)
  tls.crt: 
  tls.key: 
  # Keys expected by Akeyless Helm chart
  tlsCertificate: 
  tlsPrivateKey: 
  # CA certificate (mkcert root CA)
  ca.crt: 
