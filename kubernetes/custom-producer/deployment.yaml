apiVersion: v1
kind: Namespace
metadata:
  name: rotator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotator
  namespace: rotator
  labels:
    app: rotator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotator
  template:
    metadata:
      labels:
        app: rotator
    spec:
      containers:
        - name: rotator
          image: ghcr.io/fahmy-kadiri-akl/custom-producer/rotator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: AKEYLESS_ACCESS_ID
              valueFrom:
                secretKeyRef:
                  name: rotator-secrets
                  key: akeyless-access-id
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rotator
  namespace: rotator
spec:
  selector:
    app: rotator
  ports:
    - port: 8080
      targetPort: http
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: rotator-secrets
  namespace: rotator
type: Opaque
stringData:
  # Replace with your Akeyless Gateway access ID
  akeyless-access-id: "p-REPLACE_WITH_YOUR_ACCESS_ID"
